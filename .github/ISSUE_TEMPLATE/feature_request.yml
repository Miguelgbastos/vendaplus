name: Propor uma melhoria
description: Sugira uma funcionalidade ou evolução para o Venda+
title: "[Ideia]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Explique a necessidade antes de descrever a solução.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva o comportamento desejado e alternativas consideradas.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto técnico
      description: Considere compatibilidade, tenant_id, RLS, migrations e integrações.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Procurei uma proposta existente sobre o mesmo tema.
          required: true
        - label: A proposta não contém dados pessoais, credenciais ou informações de clientes.
          required: true
